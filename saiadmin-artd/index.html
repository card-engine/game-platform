<!doctype html>
<html>
  <head>
    <title>MGames</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MGames - A modern admin dashboard system built with Vue 3, Element Plus, and Webman."
    />

    <script>
      ;(function () {
        let dark = false

        try {
          dark = localStorage.getItem('sys-theme') === 'dark'
        } catch (e) {
          console.warn('Failed to read initial theme:', e)
        }

        document.documentElement.classList.toggle('dark', dark)

        const favicon = document.createElement('link')
        favicon.id = 'app-favicon'
        favicon.rel = 'icon'
        favicon.type = 'image/svg+xml'

        const updateFavicon = () => {
          if (!document.documentElement.classList.contains('dark')) {
            favicon.href = '/favicon-light.svg?v=3'
            return
          }

          const color = getComputedStyle(document.documentElement)
            .getPropertyValue('--el-color-primary')
            .trim()
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 16 96 96"><path fill="${color || '#5D87FF'}" fill-rule="evenodd" d="M20 86 27 44c2-10 10-16 20-16h6c4 0 6 15 11 15s7-15 11-15h6c10 0 18 6 20 16l7 42c2 11-11 18-19 10L77 84H51L39 96c-8 8-21 1-19-10ZM37 53h8v8h8v8h-8v8h-8v-8h-8v-8h8v-8Zm41 12a5 5 0 1 0 0 10 5 5 0 1 0 0-10Z"/><circle cx="89" cy="59" r="7" fill="#C7FF3D"/></svg>`
          favicon.href = `data:image/svg+xml,${encodeURIComponent(svg)}`
        }

        updateFavicon()
        document.head.append(favicon)
        new MutationObserver(updateFavicon).observe(document.documentElement, {
          attributes: true,
          attributeFilter: ['class', 'style']
        })
      })()
    </script>

    <style>
      /* 防止页面刷新时白屏的初始样式 */
      html {
        background-color: #fafbfc;
      }

      html.dark {
        background-color: #070707;
      }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

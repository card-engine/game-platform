# Include inside the simple-vue Nginx server block.
# Hashed /assets files keep the site's existing cache policy.
location = /sw.js {
    expires off;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
}

location = /index.html {
    expires off;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
}

location = /manifest.webmanifest {
    expires off;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}
